name: Release

# Why: every push to main publishes/refreshes a downloadable release. The version
# is read from tauri.conf.json, so the release is tagged v<version>. Bump the
# version (pnpm bump <semver>) to cut a fresh tagged release; pushes that keep the
# same version refresh that release's binaries in place.
#
# Flow (canonical multi-platform tauri-action pattern):
#   version        -> read the version from tauri.conf.json
#   create-release -> create ONE draft release (skipped if it already exists),
#                     emit its id. A single creator avoids the parallel-create race.
#   build (matrix) -> build each platform and upload assets to that release id.
#   publish        -> flip the release to public only after ALL platforms uploaded,
#                     so the public never sees a half-built release.
on:
  push:
    branches: [main]
  workflow_dispatch:

# tauri-action / gh need write access to create the release and upload binaries.
# The repo default token is read-only, so this is required.
permissions:
  contents: write

# A newer push to main supersedes an in-flight release build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "version=$(jq -r .version crates/yande-dl-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

  create-release:
    name: Create draft release
    needs: version
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          # Reuse an existing release for this tag if present. We match on tag_name
          # via the list API because a DRAFT release has no git tag yet and cannot be
          # looked up by tag (releases/tags/<tag> 404s for drafts). On a same-version
          # re-push this reuses the live release and never un-publishes it.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "[.[] | select(.tag_name==\"$tag\")][0].id // empty")
          if [ -z "$id" ]; then
            case "$VERSION" in *-*) pre=true ;; *) pre=false ;; esac
            id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$tag" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="yande-dl $tag" \
              -F draft=true \
              -F prerelease="$pre" \
              -f body="$(cat .github/RELEASE_NOTES.md)" \
              --jq .id)
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: [version, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-aarch64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-x86_64,  os: macos-latest, target: x86_64-apple-darwin }
          - { name: linux-x86_64,  os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc }

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
        working-directory: ui

      # Why: tauri-action runs the CLI with cwd=projectPath (crates/yande-dl-tauri),
      # so the config's `beforeBuildCommand: pnpm --dir ui build` would resolve to
      # crates/yande-dl-tauri/ui (which does not exist). Override it to point at the
      # real ui dir relative to projectPath. frontendDist (../../ui/dist) is unaffected.
      # releaseId (no tagName) makes tauri-action upload to the pre-created draft
      # instead of creating its own release, which avoids the parallel-create race.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/yande-dl-tauri
          args: '--target ${{ matrix.target }} --config {"build":{"beforeBuildCommand":"pnpm --dir ../../ui build"}}'
          releaseId: ${{ needs.create-release.outputs.release_id }}

  publish:
    name: Publish release
    needs: [create-release, build]
    runs-on: ubuntu-22.04
    steps:
      # Publish by release id via PATCH (gh release edit looks up by tag, which a
      # draft does not have yet). Setting draft=false publishes AND creates the
      # v<version> git tag at the release's target commit. Runs only after every
      # build job succeeds, so the public never sees a partial release.
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false
